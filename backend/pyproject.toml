[project]
name = "lexora-backend"
version = "0.1.0"
description = "FastAPI backend skeleton for Lexora"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.8",
    "pydantic-settings>=2.7.1",
    "supabase>=2.12.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
