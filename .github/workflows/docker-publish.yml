name: "Docker — Publish"

# Called by cd.yml orchestrator (after CI gate), or triggered manually.
# No direct push trigger — cd.yml owns the push → main flow to prevent
# double-runs (cd.yml gate + direct publish running simultaneously).

on:
  workflow_call:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lexora

jobs:
  publish:
    name: Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # The single published package is the backend image tagged as "lexora".
      # This is the only package that appears under the repository on GitHub.
      - name: Build and push — lexora (backend)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend (validate only — not published to GHCR)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            VITE_API_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max
