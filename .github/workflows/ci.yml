name: "CI"

# Orchestrator — calls each focused workflow as a gate.
# Runs on push/PR to main and develop.
# Also callable as a reusable workflow by cd.yml and release.yml.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint-backend:
    name: Lint — Backend
    uses: ./.github/workflows/lint-backend.yml

  test-backend:
    name: Test — Backend
    uses: ./.github/workflows/test-backend.yml

  build-frontend:
    name: Build — Frontend
    uses: ./.github/workflows/build-frontend.yml

  # Docker build-check only runs on pull requests — wasteful to run on every push.
  docker-build:
    name: Docker — Build Check
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/docker-build.yml
