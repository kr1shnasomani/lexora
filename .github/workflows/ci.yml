name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Allow this workflow to be called by cd.yml as a gate
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # --- 1. Backend lint ---
  lint-backend:
    name: Lint - Backend (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        # E501 = line too long (handled by formatter), F401 = unused imports (many
        #        are re-exported from __init__ files), W503 = stylistic preference
        run: |
          ruff check backend/ \
            --ignore E501,W503 \
            --exclude backend/venv,backend/__pycache__ \
            --output-format=github

  # --- 2. Layer 2 unit tests (fully mocked, no external services) ---
  test-layer2:
    name: Test - Layer 2 Policy Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Install grpcio from a pre-built binary wheel to avoid the multi-minute
      # source compilation that occurs on Linux without headers.
      - name: Install grpcio (binary wheel)
        run: "pip install grpcio grpcio-tools --only-binary :all:"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Layer 2 unit tests
        run: python tests/test_layer2.py
        # L3/L4 tests require live Supabase, Qdrant, Neo4j — run them manually
        # or via a separate integration test job that consumes repo secrets.

  # --- 3. Frontend build ---
  build-frontend:
    name: Build - Frontend (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          # Vite replaces this at build time — supply a placeholder so the build
          # does not fail even without a real backend URL in CI.
          VITE_API_URL: http://localhost:8000

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # --- 4. Docker build validation (PRs only) ---
  docker-build-check:
    name: Docker - Build Check
    runs-on: ubuntu-latest
    # Only build-check on PRs; the CD workflow pushes images on merge to main.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
