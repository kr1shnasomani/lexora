name: CD

on:
  push:
    branches: [main]
  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false   # never cancel an in-flight deploy

env:
  REGISTRY: ghcr.io
  # Resolves to e.g.  ghcr.io/your-org/lexora
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:

  # --- 1. Run full CI as a gate before deploying ---
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  # --- 2. Build and push Docker images ---
  build-and-push:
    name: Docker - Build and Push
    runs-on: ubuntu-latest
    needs: ci-gate
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Backend image
      - name: Build and push - backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/backend:latest
            ${{ env.IMAGE_BASE }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend image
      - name: Build and push - frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/frontend:latest
            ${{ env.IMAGE_BASE }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

