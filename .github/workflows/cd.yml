name: "CD"

# Orchestrator — gates on CI passing, then triggers Docker publish.
# Runs on every push to main (or manually via workflow_dispatch).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false   # never cancel an in-flight deploy

permissions:
  contents: read

jobs:

  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  docker-publish:
    name: Docker — Publish
    needs: ci-gate
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
