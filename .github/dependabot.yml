# Dependabot — automated dependency updates
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:

  # ── Python (backend) ──────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "backend"
    # Group all non-major Python updates into a single PR
    groups:
      python-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Ignore MAJOR bumps that require intentional migration work
    ignore:
      - dependency-name: "cohere"
        update-types: ["version-update:semver-major"]
      - dependency-name: "neo4j"
        update-types: ["version-update:semver-major"]
      - dependency-name: "reportlab"
        update-types: ["version-update:semver-major"]

  # ── npm (frontend) ────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "frontend"
    # Group all non-major npm updates into a single PR
    groups:
      npm-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Ignore MAJOR bumps that require intentional migration work
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-zoom-pan-pinch"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    # Group all action updates (including major) into one PR
    # Action major bumps are safe — they're just tag changes, not breaking API changes
    groups:
      actions-deps:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
